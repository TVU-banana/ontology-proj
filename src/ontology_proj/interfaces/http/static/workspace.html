<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>桥梁资料工作台</title><link rel="stylesheet" href="/static/query.css?v=20261013"><link rel="stylesheet" href="/static/workspace.css?v=20261013"></head><body>
<a class="skip-link" href="#main">跳到主内容</a>
<header><h1>资料与证据工作台</h1><label class="theme">主题<select id="theme"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></label><nav aria-label="工作台分区导航"><a href="#ingest">资料录入</a><a href="#knowledge">知识问答</a><a href="#report">报告生成</a><a id="query-link" href="/query">精确查询 / 原文核查</a></nav></header>
<main id="main">
<section id="scope-panel" aria-labelledby="scope-title"><h2 id="scope-title">共享资料范围</h2><div class="scope-grid"><label>桥梁<input id="bridge" list="bridge-options"><datalist id="bridge-options"></datalist></label><label>资料范围（逗号分隔）<textarea id="documents" rows="2"></textarea></label><label>构件范围（逗号分隔，可留空）<textarea id="components" rows="2"></textarea></label></div><div class="fields"><label>观测日期起<input type="date" id="date-from"></label><label>观测日期止<input type="date" id="date-to"></label></div><div class="checks"><label class="check"><input id="synthetic" type="checkbox" checked>包含合成演示资料</label><label class="check"><input id="confirmed" type="checkbox">仅人工确认</label></div></section>
<section id="ingest" aria-labelledby="ingest-title"><h2 id="ingest-title">资料录入</h2><div class="ingestion-layout"><div class="upload-area"><form id="upload-form"><label>PDF 文件<input id="file" type="file" accept="application/pdf" required></label><div class="fields"><label>资料性质<select id="source-kind"><option value="synthetic">合成演示</option><option value="real">真实资料</option></select></label><label>文档类型<select id="kind"><option value="inspection_report">检测报告</option><option value="other">其他</option></select></label></div><button>上传并登记</button></form><p id="upload-status" role="status" class="status"></p></div><div class="processing-area"><label>当前资料<input id="document"></label><div class="actions"><button id="document-read">读取状态</button><button id="process">处理资料</button><button id="retry-document">重试失败阶段</button><button id="index">建立语义索引</button></div><label>当前操作<input id="operation"></label><div class="actions"><button id="operation-read">读取操作</button><button id="poll-document">跟踪操作</button><button id="stop-document">停止跟踪</button></div><p id="document-status" role="status" class="status"></p><div id="document-output"></div></div></div><details id="bridge-directory"><summary>桥梁登记与报告归属</summary><button id="bridges-refresh" type="button">刷新已登记桥</button><form id="bridge-register-form"><label>桥名<input id="bridge-name" required maxlength="300"></label><label>完整地理位置<input id="bridge-location" maxlength="300" placeholder="如省、市、道路与具体桥址"></label><label>官方编号体系<input id="bridge-namespace" maxlength="300"></label><label>官方编号<input id="bridge-official-code" maxlength="300"></label><button>登记新桥（按当前资料性质）</button></form><p id="bridge-register-status" class="status" role="status"></p><div class="actions"><button id="bridge-resolution-read">读取报告归属</button><button id="bridge-resolution-confirm">已核对原文，确认属于所选桥</button></div><p id="bridge-resolution-status" class="status" role="status"></p><div id="bridge-resolution-output"></div></details><details><summary>信息录入 Agent</summary><form id="ingestion-agent-form"><label>任务<textarea id="ingestion-instruction" required>读取当前资料的处理结果；已完成资料无需重新处理。</textarea></label><button>运行录入角色</button></form><p id="ingestion-agent-status" role="status" class="status"></p><div id="ingestion-agent-output"></div></details></section>
<section id="knowledge" aria-labelledby="knowledge-title"><h2 id="knowledge-title">知识问答</h2><form id="answer-form"><label>问题<textarea id="question" required placeholder="例如：当前资料有哪些构件？"></textarea></label><button>生成有引用的核验答案</button></form><p id="answer-status" role="status" class="status"></p><div id="answer-output"></div><details><summary>知识问答 Agent</summary><form id="knowledge-agent-form"><label>任务<textarea id="knowledge-instruction" required>使用精确工具查询当前范围的构件，不生成报告。</textarea></label><button>运行知识角色</button></form><p id="knowledge-agent-status" role="status" class="status"></p><div id="knowledge-agent-output"></div></details></section>
<section id="report" aria-labelledby="report-title"><h2 id="report-title">病害与观测汇总报告</h2><button id="create-report">按共享范围生成报告</button><label>当前报告<input id="report-id"></label><div class="actions"><button id="report-read">读取报告</button><button id="report-retry">重试文件登记</button><button id="poll-report">跟踪报告</button><button id="stop-report">停止跟踪</button></div><p id="report-status" role="status" class="status"></p><a id="download" hidden>下载 Markdown</a><div id="report-output"></div></section>
</main><script type="module" src="/static/workspace.js?v=3"></script></body></html>
